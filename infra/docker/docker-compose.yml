services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: ragbot:local
    ports:
      - "${RAGBOT_API_PORT:-8000}:8000"
    environment:
      RAGBOT_ENV: ${RAGBOT_ENV:-development}
      RAGBOT_INGESTION_MODE: worker
      RAGBOT_API_KEYS: ${RAGBOT_API_KEYS:-}
      RAGBOT_API_KEY_PRINCIPALS: ${RAGBOT_API_KEY_PRINCIPALS:-}
      RAGBOT_LLM_PROVIDER: ${RAGBOT_LLM_PROVIDER:-openai}
      RAGBOT_CORS_ORIGINS: ${RAGBOT_CORS_ORIGINS:-http://localhost:3000}
      RAGBOT_TRACING_ENABLED: ${RAGBOT_TRACING_ENABLED:-false}
      RAGBOT_OTEL_METRICS_ENABLED: ${RAGBOT_OTEL_METRICS_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      OPENAI_WEB_MODEL: ${OPENAI_WEB_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com}
      EMBEDDING_ALLOW_ANONYMOUS: ${EMBEDDING_ALLOW_ANONYMOUS:-false}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-100}
      OLLAMA_BASE_URL: ${RAGBOT_DOCKER_OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_REASONING_EFFORT: ${OLLAMA_REASONING_EFFORT:-none}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_chunks}
      QDRANT_DIM: ${QDRANT_DIM:-1536}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-ragbot}:${POSTGRES_PASSWORD:-ragbot}@postgres:5432/${POSTGRES_DB:-ragbot}
      RAGBOT_SQL_TOOL_ENABLED: ${RAGBOT_SQL_TOOL_ENABLED:-false}
      RAGBOT_SQL_DSN: ${RAGBOT_SQL_DSN:-}
      RAGBOT_SQL_ALLOWED_SCHEMAS: ${RAGBOT_SQL_ALLOWED_SCHEMAS:-}
      RAGBOT_SQL_LIMIT: ${RAGBOT_SQL_LIMIT:-200}
      RAGBOT_SQL_TIMEOUT_MS: ${RAGBOT_SQL_TIMEOUT_MS:-3000}
      RAGBOT_RERANK_ENABLED: ${RAGBOT_RERANK_ENABLED:-false}
      RAGBOT_RERANK_PROVIDER: ${RAGBOT_RERANK_PROVIDER:-cohere}
      RAGBOT_RERANK_MODEL: ${RAGBOT_RERANK_MODEL:-rerank-v3.5}
      RAGBOT_RERANK_API_KEY: ${RAGBOT_RERANK_API_KEY:-}
      RAGBOT_RERANK_BASE_URL: ${RAGBOT_RERANK_BASE_URL:-}
      RAGBOT_RERANK_TOP_K: ${RAGBOT_RERANK_TOP_K:-10}
      RAGBOT_DATA_DIR: /data
      RAGBOT_ALLOWED_LOCAL_SOURCE_ROOTS: /data
      RAGBOT_UPLOAD_STORE: filesystem
      RAGBOT_UPLOAD_DIR: /var/lib/ragbot/uploads
      RAGBOT_WEB_ALLOWED_HOSTS: ${RAGBOT_WEB_ALLOWED_HOSTS:-}
      RAGBOT_PDF_ALLOWED_HOSTS: ${RAGBOT_PDF_ALLOWED_HOSTS:-}
      RAGBOT_GIT_ALLOWED_HOSTS: ${RAGBOT_GIT_ALLOWED_HOSTS:-}
      RAGBOT_ALLOW_PRIVATE_SOURCE_NETWORKS: ${RAGBOT_ALLOW_PRIVATE_SOURCE_NETWORKS:-false}
      RAGBOT_WEB_MAX_REDIRECTS: ${RAGBOT_WEB_MAX_REDIRECTS:-5}
      RAGBOT_PDF_MAX_REDIRECTS: ${RAGBOT_PDF_MAX_REDIRECTS:-5}
      RAGBOT_PDF_MAX_BYTES: ${RAGBOT_PDF_MAX_BYTES:-26214400}
      OTEL_EXPORTER_OTLP_ENDPOINT: http://jaeger:4317
      CODE_REPO_ROOT: /app
    volumes:
      - type: bind
        source: ${RAGBOT_DATA_DIR:-../../data}
        target: /data
        read_only: true
      - ingestion_uploads:/var/lib/ragbot/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    restart: unless-stopped

  worker:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: ragbot:local
    command: ["python", "-m", "services.worker.main"]
    # The shared image probes an HTTP API; the worker has no HTTP listener.
    healthcheck:
      disable: true
    env_file:
      - ${RAGBOT_WORKER_ENV_FILE:-../../.env.worker.example}
    environment:
      RAGBOT_ENV: ${RAGBOT_ENV:-development}
      RAGBOT_INGESTION_MODE: worker
      RAGBOT_WORKER_POLL_SECONDS: ${RAGBOT_WORKER_POLL_SECONDS:-1}
      RAGBOT_WORKER_LEASE_SECONDS: ${RAGBOT_WORKER_LEASE_SECONDS:-120}
      RAGBOT_WORKER_MAX_ATTEMPTS: ${RAGBOT_WORKER_MAX_ATTEMPTS:-3}
      RAGBOT_WORKER_RETRY_BASE_SECONDS: ${RAGBOT_WORKER_RETRY_BASE_SECONDS:-5}
      RAGBOT_WORKER_RETRY_MAX_SECONDS: ${RAGBOT_WORKER_RETRY_MAX_SECONDS:-300}
      RAGBOT_RECONCILE_SECONDS: ${RAGBOT_RECONCILE_SECONDS:-30}
      RAGBOT_SCHEDULER_SCAN_SECONDS: ${RAGBOT_SCHEDULER_SCAN_SECONDS:-30}
      RAGBOT_PROVIDER_MAX_ATTEMPTS: ${RAGBOT_PROVIDER_MAX_ATTEMPTS:-4}
      RAGBOT_PROVIDER_BACKOFF_BASE_SECONDS: ${RAGBOT_PROVIDER_BACKOFF_BASE_SECONDS:-0.5}
      RAGBOT_PROVIDER_BACKOFF_MAX_SECONDS: ${RAGBOT_PROVIDER_BACKOFF_MAX_SECONDS:-30}
      RAGBOT_LLM_PROVIDER: ${RAGBOT_LLM_PROVIDER:-openai}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_BASE_URL: ${OPENAI_BASE_URL:-https://api.openai.com}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      EMBEDDING_API_KEY: ${EMBEDDING_API_KEY:-}
      EMBEDDING_BASE_URL: ${EMBEDDING_BASE_URL:-https://api.openai.com}
      EMBEDDING_ALLOW_ANONYMOUS: ${EMBEDDING_ALLOW_ANONYMOUS:-false}
      EMBEDDING_TIMEOUT_SECONDS: ${EMBEDDING_TIMEOUT_SECONDS:-30}
      EMBEDDING_BATCH_SIZE: ${EMBEDDING_BATCH_SIZE:-100}
      OLLAMA_BASE_URL: ${RAGBOT_DOCKER_OLLAMA_BASE_URL:-http://ollama:11434}
      OLLAMA_MODEL: ${OLLAMA_MODEL:-llama3}
      OLLAMA_TIMEOUT_SECONDS: ${OLLAMA_TIMEOUT_SECONDS:-300}
      OLLAMA_REASONING_EFFORT: ${OLLAMA_REASONING_EFFORT:-none}
      QDRANT_URL: http://qdrant:6333
      QDRANT_API_KEY: ${QDRANT_API_KEY:-}
      QDRANT_COLLECTION: ${QDRANT_COLLECTION:-rag_chunks}
      QDRANT_DIM: ${QDRANT_DIM:-1536}
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-ragbot}:${POSTGRES_PASSWORD:-ragbot}@postgres:5432/${POSTGRES_DB:-ragbot}
      RAGBOT_DATA_DIR: /data
      RAGBOT_ALLOWED_LOCAL_SOURCE_ROOTS: /data
      RAGBOT_UPLOAD_STORE: filesystem
      RAGBOT_UPLOAD_DIR: /var/lib/ragbot/uploads
      RAGBOT_UPLOAD_RETENTION_SECONDS: ${RAGBOT_UPLOAD_RETENTION_SECONDS:-86400}
      RAGBOT_WEB_ALLOWED_HOSTS: ${RAGBOT_WEB_ALLOWED_HOSTS:-}
      RAGBOT_PDF_ALLOWED_HOSTS: ${RAGBOT_PDF_ALLOWED_HOSTS:-}
      RAGBOT_GIT_ALLOWED_HOSTS: ${RAGBOT_GIT_ALLOWED_HOSTS:-}
      RAGBOT_ALLOW_PRIVATE_SOURCE_NETWORKS: ${RAGBOT_ALLOW_PRIVATE_SOURCE_NETWORKS:-false}
      RAGBOT_WEB_MAX_REDIRECTS: ${RAGBOT_WEB_MAX_REDIRECTS:-5}
      RAGBOT_PDF_MAX_REDIRECTS: ${RAGBOT_PDF_MAX_REDIRECTS:-5}
      RAGBOT_PDF_MAX_BYTES: ${RAGBOT_PDF_MAX_BYTES:-26214400}
      CODE_REPO_ROOT: /app
    volumes:
      - type: bind
        source: ${RAGBOT_DATA_DIR:-../../data}
        target: /data
        read_only: true
      - ingestion_uploads:/var/lib/ragbot/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
      qdrant:
        condition: service_started
    restart: unless-stopped
    stop_grace_period: 30s

  migrate:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    image: ragbot:local
    command: ["python", "-m", "services.api.app.storage.migrations"]
    healthcheck:
      disable: true
    environment:
      POSTGRES_DSN: postgresql://${POSTGRES_USER:-ragbot}:${POSTGRES_PASSWORD:-ragbot}@postgres:5432/${POSTGRES_DB:-ragbot}
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-ragbot}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-ragbot}
      POSTGRES_DB: ${POSTGRES_DB:-ragbot}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-ragbot} -d ${POSTGRES_DB:-ragbot}"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:v1.19.0
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
    environment:
      COLLECTOR_OTLP_ENABLED: "true"
    profiles: [observability]
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles: [ollama]
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
  ingestion_uploads:
