version: "3.9"

services:
  api:
    build:
      context: ../..
      dockerfile: infra/docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      - LOG_LEVEL=INFO
      - LOG_FORMAT=json
      - RAGBOT_API_KEYS=
      - RAGBOT_LLM_PROVIDER=openai
      - RAGBOT_CORS_ORIGINS=http://localhost:3000
      - RAGBOT_TRACING_ENABLED=true
      - RAGBOT_CACHE_ENABLED=true
      - RAGBOT_CACHE_TTL_SECONDS=300
      - RAGBOT_MODEL_ROUTING=false
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - OPENAI_MODEL=gpt-4o-mini
      - RAGBOT_MODEL_FAST=gpt-4o-mini
      - RAGBOT_MODEL_STRONG=gpt-4o
      - OLLAMA_BASE_URL=http://ollama:11434
      - OLLAMA_MODEL=llama3
      - QDRANT_URL=http://qdrant:6333
      - QDRANT_COLLECTION=rag_chunks
      - QDRANT_DIM=1536
      - POSTGRES_DSN=postgresql://ragbot:ragbot@postgres:5432/ragbot
      - OTEL_EXPORTER_OTLP_ENDPOINT=http://jaeger:4317
      - OTEL_SERVICE_NAME=ragbot-api
    depends_on:
      postgres:
        condition: service_healthy
      qdrant:
        condition: service_started
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ragbot
      POSTGRES_PASSWORD: ragbot
      POSTGRES_DB: ragbot
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ../migrations:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ragbot"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "4317:4317"    # OTLP gRPC
      - "4318:4318"    # OTLP HTTP
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    profiles:
      - observability
    restart: unless-stopped

  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    profiles:
      - ollama
    restart: unless-stopped

volumes:
  postgres_data:
  qdrant_data:
  ollama_data:
