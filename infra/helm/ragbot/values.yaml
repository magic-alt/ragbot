# Default values for ragbot Helm chart.
# Defaults remain development-friendly. Production must set RAGBOT_ENV=production,
# external PostgreSQL/Qdrant, semantic embeddings, scoped API principals and the
# durable ingestion worker.

replicaCount: 1

image:
  repository: ragbot
  tag: "0.5.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: ragbot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

worker:
  enabled: false
  replicaCount: 1
  pollSeconds: "1"
  leaseSeconds: "120"
  maxAttempts: "3"
  retryBaseSeconds: "5"
  retryMaxSeconds: "300"
  reconcileSeconds: "30"
  schedulerScanSeconds: "30"
  publicationOutboxScanSeconds: "5"
  publicationOutboxMaxAttempts: "10"
  providerMaxAttempts: "4"
  providerBackoffBaseSeconds: "0.5"
  providerBackoffMaxSeconds: "30"
  extraEnv: []
  extraEnvFrom: []
  autoscaling:
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 15
    cooldownPeriod: 120
    targetJobsPerWorker: "4"
    activationJobs: "1"
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 256Mi

env:
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  RAGBOT_ENV: development
  RAGBOT_LLM_PROVIDER: openai
  RAGBOT_TRACING_ENABLED: "true"
  RAGBOT_OTEL_METRICS_ENABLED: "false"
  RAGBOT_MODEL_ROUTING: "false"
  RAGBOT_ALLOWED_LOCAL_SOURCE_ROOTS: /data
  RAGBOT_ALLOW_PRIVATE_SOURCE_NETWORKS: "false"
  OTEL_SERVICE_NAME: ragbot-api

postgres:
  dsn: ""
qdrant:
  url: ""
  collection: rag_chunks
  dim: "1536"
otel:
  endpoint: ""

# Server-managed client uploads use a Ragbot-owned UploadStore. The filesystem
# adapter needs one shared volume mounted by every API and worker replica.
# For multi-node production use an RWX-capable storage class/existing claim, or
# replace this adapter with a future object-store UploadStore implementation.
uploadStorage:
  enabled: false
  mountPath: /var/lib/ragbot/uploads
  existingClaim: ""
  storageClassName: ""
  accessModes:
    - ReadWriteMany
  size: 10Gi
  retentionSeconds: "86400"

existingSecret: ""

extraVolumes: []
extraVolumeMounts: []

livenessProbe:
  httpGet:
    path: /admin/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /admin/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
