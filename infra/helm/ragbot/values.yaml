# Default values for ragbot Helm chart.
# Defaults remain development-friendly. Production must set RAGBOT_ENV=production,
# external PostgreSQL/Qdrant, semantic embeddings, scoped API principals and the
# durable ingestion worker.

replicaCount: 1

image:
  repository: ragbot
  tag: "0.5.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: ragbot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

worker:
  enabled: false
  replicaCount: 1
  pollSeconds: "1"
  leaseSeconds: "120"
  maxAttempts: "3"
  schedulerScanSeconds: "30"
  # Worker-only environment is the preferred way to expose cloud connector
  # credential references. API pods do not need SaaS credentials.
  # extraEnv accepts ordinary Kubernetes EnvVar objects; use secretKeyRef rather
  # than literal secret values in committed values files.
  extraEnv: []
  # extraEnvFrom can import a dedicated connector Secret/ExternalSecret.
  # Example:
  # extraEnvFrom:
  #   - secretRef:
  #       name: ragbot-saas-connectors
  extraEnvFrom: []
  autoscaling:
    # Optional KEDA PostgreSQL scaler. Requires the KEDA CRDs/operator to be
    # installed in the cluster. It reads POSTGRES_DSN from the worker target and
    # scales on ready pending Jobs plus expired running leases.
    enabled: false
    minReplicaCount: 1
    maxReplicaCount: 10
    pollingInterval: 15
    cooldownPeriod: 120
    targetJobsPerWorker: "4"
    activationJobs: "1"
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 256Mi

env:
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  RAGBOT_ENV: development
  RAGBOT_LLM_PROVIDER: openai
  RAGBOT_TRACING_ENABLED: "true"
  RAGBOT_CACHE_ENABLED: "true"
  RAGBOT_CACHE_TTL_SECONDS: "300"
  RAGBOT_MODEL_ROUTING: "false"
  RAGBOT_ALLOWED_LOCAL_SOURCE_ROOTS: /data
  RAGBOT_ALLOW_PRIVATE_SOURCE_NETWORKS: "false"
  OTEL_SERVICE_NAME: ragbot-api

postgres:
  dsn: ""
qdrant:
  url: ""
  collection: rag_chunks
  dim: "1536"
otel:
  endpoint: ""

# Optional existing Secret keys used by the core chart:
#   postgres-dsn
#   openai-api-key
#   embedding-api-key
#   api-keys
#   api-key-principals
#   qdrant-api-key
# Cloud/SaaS credentials should normally use worker.extraEnv/extraEnvFrom so
# secret material is not exposed to the API deployment.
existingSecret: ""

extraVolumes: []
extraVolumeMounts: []

livenessProbe:
  httpGet:
    path: /admin/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /admin/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
