# Default values for ragbot Helm chart.
# Defaults remain development-friendly. Production must set RAGBOT_ENV=production,
# external PostgreSQL/Qdrant, semantic embeddings, scoped API principals and the
# durable ingestion worker.

replicaCount: 1

image:
  repository: ragbot
  tag: "0.5.0"
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 8000

ingress:
  enabled: false
  className: nginx
  annotations: {}
  hosts:
    - host: ragbot.local
      paths:
        - path: /
          pathType: Prefix

resources:
  limits:
    cpu: "2"
    memory: 2Gi
  requests:
    cpu: 500m
    memory: 512Mi

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 10
  targetCPUUtilizationPercentage: 70

worker:
  # Development can keep this disabled and run API ingestion inline. Production
  # rendering fails unless the durable worker is enabled.
  enabled: false
  replicaCount: 1
  pollSeconds: "1"
  leaseSeconds: "120"
  maxAttempts: "3"
  resources:
    limits:
      cpu: "2"
      memory: 2Gi
    requests:
      cpu: 250m
      memory: 256Mi

env:
  LOG_LEVEL: INFO
  LOG_FORMAT: json
  RAGBOT_ENV: development
  RAGBOT_LLM_PROVIDER: openai
  RAGBOT_TRACING_ENABLED: "true"
  RAGBOT_CACHE_ENABLED: "true"
  RAGBOT_CACHE_TTL_SECONDS: "300"
  RAGBOT_MODEL_ROUTING: "false"
  RAGBOT_ALLOWED_LOCAL_SOURCE_ROOTS: /data
  RAGBOT_ALLOW_PRIVATE_SOURCE_NETWORKS: "false"
  OTEL_SERVICE_NAME: ragbot-api

# External services. Production/multi-replica deployments should configure both.
postgres:
  dsn: ""
qdrant:
  url: ""
  collection: rag_chunks
  dim: "1536"
otel:
  endpoint: ""

# Optional existing Secret keys used by the chart:
#   postgres-dsn
#   openai-api-key
#   api-keys
#   api-key-principals
#   qdrant-api-key
existingSecret: ""

# Optional data/config mounts for local_fs/local PDF/local Git sources. Production
# paths must remain inside RAGBOT_ALLOWED_LOCAL_SOURCE_ROOTS. These mounts are
# shared by the API and ingestion worker so source paths have identical meaning.
extraVolumes: []
# Example:
# extraVolumes:
#   - name: knowledge
#     persistentVolumeClaim:
#       claimName: ragbot-knowledge
extraVolumeMounts: []
# Example:
# extraVolumeMounts:
#   - name: knowledge
#     mountPath: /data
#     readOnly: true

livenessProbe:
  httpGet:
    path: /admin/health
    port: 8000
  initialDelaySeconds: 10
  periodSeconds: 30
readinessProbe:
  httpGet:
    path: /admin/ready
    port: 8000
  initialDelaySeconds: 5
  periodSeconds: 10

strategy:
  type: RollingUpdate
  rollingUpdate:
    maxUnavailable: 0
    maxSurge: 1
