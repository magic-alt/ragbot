{{- if .Values.worker.enabled -}}
{{- if and (not .Values.existingSecret) (not .Values.postgres.dsn) -}}
{{- fail "worker.enabled=true requires postgres.dsn or existingSecret" -}}
{{- end -}}
{{- if not .Values.qdrant.url -}}
{{- fail "worker.enabled=true requires qdrant.url" -}}
{{- end -}}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ .Release.Name }}-worker
  labels:
    app: ragbot
    component: worker
spec:
  replicas: {{ .Values.worker.replicaCount }}
  strategy:
    type: RollingUpdate
  selector:
    matchLabels:
      app: ragbot
      component: worker
  template:
    metadata:
      labels:
        app: ragbot
        component: worker
    spec:
      initContainers:
        - name: migrate
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "services.api.app.storage.migrations"]
          env:
            {{- if .Values.existingSecret }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-dsn
            {{- else }}
            - name: POSTGRES_DSN
              value: {{ .Values.postgres.dsn | quote }}
            {{- end }}
      containers:
        - name: worker
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          command: ["python", "-m", "services.worker.main"]
          env:
            {{- range $key, $value := .Values.env }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
            - name: RAGBOT_INGESTION_MODE
              value: "worker"
            - name: RAGBOT_WORKER_POLL_SECONDS
              value: {{ .Values.worker.pollSeconds | quote }}
            - name: RAGBOT_WORKER_LEASE_SECONDS
              value: {{ .Values.worker.leaseSeconds | quote }}
            - name: RAGBOT_WORKER_MAX_ATTEMPTS
              value: {{ .Values.worker.maxAttempts | quote }}
            - name: QDRANT_URL
              value: {{ .Values.qdrant.url | quote }}
            - name: QDRANT_COLLECTION
              value: {{ .Values.qdrant.collection | quote }}
            - name: QDRANT_DIM
              value: {{ .Values.qdrant.dim | quote }}
            {{- if .Values.existingSecret }}
            - name: POSTGRES_DSN
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: postgres-dsn
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: openai-api-key
                  optional: true
            - name: EMBEDDING_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: embedding-api-key
                  optional: true
            - name: QDRANT_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.existingSecret }}
                  key: qdrant-api-key
                  optional: true
            {{- else }}
            - name: POSTGRES_DSN
              value: {{ .Values.postgres.dsn | quote }}
            {{- end }}
          {{- with .Values.extraVolumeMounts }}
          volumeMounts:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          resources:
            {{- toYaml .Values.worker.resources | nindent 12 }}
      terminationGracePeriodSeconds: 30
      {{- with .Values.extraVolumes }}
      volumes:
        {{- toYaml . | nindent 8 }}
      {{- end }}
{{- end }}
