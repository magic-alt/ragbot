{{- if and .Values.uploadStorage.enabled (not .Values.uploadStorage.existingClaim) -}}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Release.Name }}-upload
  labels:
    app: ragbot
    component: upload-storage
spec:
  accessModes:
    {{- toYaml .Values.uploadStorage.accessModes | nindent 4 }}
  {{- if .Values.uploadStorage.storageClassName }}
  storageClassName: {{ .Values.uploadStorage.storageClassName | quote }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.uploadStorage.size }}
{{- end }}
