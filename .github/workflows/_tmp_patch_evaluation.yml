          helper = '''def _as_list(value: Any) -> list[Any]:
    if value is None:
        return []
    if isinstance(value, (list, tuple, set)):
        return list(value)
    return [value]


def _assert_promotion_relevance_scope(
    dataset: Mapping[str, Any],
    cases: Sequence[Mapping[str, Any]],
) -> dict[str, Any]:
    ambiguous: list[str] = []
    scoped_heuristic: list[str] = []
    explicit: list[str] = []
    for case in cases:
        rel = case.get("relevance") or {}
        if not isinstance(rel, Mapping):
            ambiguous.append(str(case.get("id") or "<unknown>"))
            continue
        if rel.get("relevant_total") is not None:
            if int(rel["relevant_total"]) <= 0:
                raise ValueError("relevance.relevant_total must be > 0")
            explicit.append(str(case.get("id") or "<unknown>"))
            continue
        if rel.get("expected_chunk_ids") or rel.get("doc_ids"):
            explicit.append(str(case.get("id") or "<unknown>"))
            continue
        filters = _filters(dataset, case, "__promotion_scope__")
        doc_ids = [str(v) for v in _as_list(filters.get("doc_ids")) if str(v)]
        single_doc = len(set(doc_ids)) == 1
        heuristic = bool(
            rel.get("all_terms")
            or rel.get("any_terms")
            or rel.get("path_contains")
            or rel.get("pages")
        )
        if heuristic and single_doc:
            scoped_heuristic.append(str(case.get("id") or "<unknown>"))
            continue
        ambiguous.append(str(case.get("id") or "<unknown>"))
    if ambiguous:
        raise ValueError(
            "Promotion-ineligible Golden Dataset: relevance universe is ambiguous for cases="
            + ",".join(ambiguous)
            + ". Term/path/page labels require defaults.filters.doc_ids or case.filters.doc_ids "
            "scoped to exactly one document, or relevance.relevant_total / explicit doc_ids/chunk_ids."
        )
    return {
        "promotion_eligible": True,
        "explicit_cases": len(explicit),
        "single_document_heuristic_cases": len(scoped_heuristic),
        "ambiguous_cases": 0,
    }


'''
