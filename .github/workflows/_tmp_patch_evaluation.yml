def _known_relevant_total(
    case: Mapping[str, Any],
    *,
    filters: Optional[Mapping[str, Any]] = None,
) -> Optional[int]:
    rel = case.get("relevance") or {}
    if not isinstance(rel, Mapping):
        return None
    explicit_total = rel.get("relevant_total")
    if explicit_total is not None:
        value = int(explicit_total)
        if value <= 0:
            raise ValueError("relevance.relevant_total must be > 0")
        return value
    expected_chunk_ids = [str(v) for v in _as_list(rel.get("expected_chunk_ids")) if str(v)]
    if expected_chunk_ids:
        return len(set(expected_chunk_ids))
    doc_ids = [str(v) for v in _as_list(rel.get("doc_ids")) if str(v)]
    if doc_ids:
        return len(set(doc_ids))
    pages = [str(v) for v in _as_list(rel.get("pages")) if v is not None and str(v)]
    if pages and _single_document_scope(filters):
        return len(set(pages))
    # Term/path labels identify matching evidence but do not define the complete
    # relevance universe. They are only countable when the query is explicitly
    # scoped to one document; otherwise Recall/nDCG must remain unavailable.
    if (
        rel.get("all_terms")
        or rel.get("any_terms")
        or rel.get("path_contains")
    ) and _single_document_scope(filters):
        return 1
    return None
'''
          if old not in text:
