name: Temporary identifier canonicalization patch

on:
  push:
    branches:
      - fix/issue-57-identifier-canonicalization
    paths:
      - .github/workflows/_tmp_identifier_patch.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: fix/issue-57-identifier-canonicalization
      - name: Preserve standalone rag_eval execution
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path('scripts/rag_eval.py')
          text = path.read_text(encoding='utf-8')
          old = '''from benchmarks.identifier_relevance import any_identifier_matches\n\nROOT = Path(__file__).resolve().parents[1]\n'''
          new = '''ROOT = Path(__file__).resolve().parents[1]\nif str(ROOT) not in sys.path:\n    sys.path.insert(0, str(ROOT))\n\nfrom benchmarks.identifier_relevance import any_identifier_matches\n'''
          if old not in text:
              raise SystemExit('rag_eval identifier import anchor not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          python scripts/rag_eval.py --help >/dev/null
          python -m pip install --quiet -e ".[dev]"
          python -m pytest -q tests/test_identifier_relevance.py tests/test_rag_native_compare_benchmark.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add scripts/rag_eval.py
          git commit -m "fix: preserve standalone rag eval imports"
          git push origin HEAD:fix/issue-57-identifier-canonicalization
