name: Weighted RRF Retrieval Gate

on:
  pull_request:
    paths:
      - "services/api/app/retrieval/contracts.py"
      - "services/api/app/retrieval/qdrant_hybrid.py"
      - "services/api/app/retrieval/sparse_engine.py"
      - "benchmarks/weighted_rrf_promotion.py"
      - "eval/datasets/deepseek_in_action_retrieval_v2.json"
      - "tests/test_weighted_rrf_phase21.py"
      - "tests/test_qdrant_weighted_rrf_integration.py"
      - ".github/workflows/weighted-rrf.yml"
  push:
    branches: [main]
    paths:
      - "services/api/app/retrieval/contracts.py"
      - "services/api/app/retrieval/qdrant_hybrid.py"
      - "services/api/app/retrieval/sparse_engine.py"
      - "benchmarks/weighted_rrf_promotion.py"
      - "eval/datasets/deepseek_in_action_retrieval_v2.json"
      - "tests/test_qdrant_weighted_rrf_integration.py"
      - ".github/workflows/weighted-rrf.yml"

permissions:
  contents: read

jobs:
  weighted-rrf:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333
    env:
      QDRANT_TEST_URL: http://127.0.0.1:6333
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install retrieval test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,qdrant,sparse]"
      - name: Wait for Qdrant
        run: |
          python - <<'PY'
          import time
          import urllib.request
          for _ in range(60):
              try:
                  with urllib.request.urlopen("http://127.0.0.1:6333/readyz", timeout=2) as response:
                      if response.status == 200:
                          raise SystemExit(0)
              except Exception:
                  time.sleep(1)
          raise SystemExit("Qdrant did not become ready")
          PY
      - name: Run weighted RRF contract and grid tests
        run: python -m pytest -q tests/test_weighted_rrf_phase21.py
      - name: Run real Qdrant weighted RRF integration
        run: python -m pytest -q tests/test_qdrant_weighted_rrf_integration.py
      - name: Audit expanded Golden Dataset with bounded runtime scope
        run: |
          python - <<'PY'
          from pathlib import Path
          from benchmarks.promotion_evidence import assert_promotion_relevance_scope
          from benchmarks.rag_native_compare import load_golden_dataset
          from benchmarks.weighted_rrf_promotion import _scoped_dataset, parse_weight_pairs

          dataset = load_golden_dataset(Path("eval/datasets/deepseek_in_action_retrieval_v2.json"))
          scoped = _scoped_dataset(dataset, "ci-deepseek-doc")
          audit = assert_promotion_relevance_scope(scoped)
          assert audit["promotion_eligible"] is True
          assert len(scoped["cases"]) >= 20
          categories = {case["category"] for case in scoped["cases"]}
          required = {"exact", "identifier", "paraphrase", "cross-lingual", "mixed-cn-en", "weak-lexical", "strong-lexical"}
          assert required <= categories
          assert [spec.weights for spec in parse_weight_pairs("1:1,2:1,3:1,5:1")] == [(1.0,1.0),(2.0,1.0),(3.0,1.0),(5.0,1.0)]
          PY
