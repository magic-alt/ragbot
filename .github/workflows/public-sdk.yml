name: Public SDK Gate

on:
  pull_request:
    paths:
      - "packages/node-client/**"
      - "packages/python-client/**"
      - "services/api/app/api.py"
      - "services/api/app/middleware.py"
      - "services/api/app/public_contract.py"
      - "contracts/public_api_v1_contract.json"
      - "scripts/check_public_api_contract.py"
      - "tests/test_public_api_v1.py"
      - ".github/workflows/public-sdk.yml"
  push:
    branches: [main]
    paths:
      - "packages/node-client/**"
      - "packages/python-client/**"
      - "services/api/app/api.py"
      - "services/api/app/middleware.py"
      - "services/api/app/public_contract.py"
      - "contracts/public_api_v1_contract.json"
      - "scripts/check_public_api_contract.py"

permissions:
  contents: read

jobs:
  python-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install SDK and test dependencies
        run: |
          python -m pip install --upgrade pip build pytest
          python -m pip install -e packages/python-client
      - name: Run Python SDK tests
        run: python -m pytest -q packages/python-client/tests
      - name: Build wheel and sdist
        run: python -m build packages/python-client

  node-sdk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"
      - name: Install Node SDK dependencies
        working-directory: packages/node-client
        run: npm install --no-package-lock --ignore-scripts
      - name: Typecheck Node SDK
        working-directory: packages/node-client
        run: npm run typecheck
      - name: Run Node SDK tests
        working-directory: packages/node-client
        run: npm test
      - name: Dry-run npm package
        working-directory: packages/node-client
        run: npm run pack:dry-run

  api-contract:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip
      - name: Install API contract dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,qdrant,worker,s3,saas]"
      - name: Run v1 API behavior tests
        run: python -m pytest -q tests/test_public_api_v1.py
      - name: Check frozen OpenAPI compatibility manifest
        run: python scripts/check_public_api_contract.py
