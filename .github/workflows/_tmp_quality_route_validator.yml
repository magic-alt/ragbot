name: Temporary quality route validator patch

on:
  push:
    branches:
      - feat/issue-57-promotion-release-gates
    paths:
      - .github/workflows/_tmp_quality_route_validator.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-57-promotion-release-gates
      - name: Patch and test API validation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('services/api/app/routes/quality.py')
          text = path.read_text(encoding='utf-8')
          text = text.replace(
              'from pydantic import BaseModel, Field\n',
              'from pydantic import BaseModel, Field, field_validator\n',
              1,
          )
          anchor = '''    critical_case_ids: list[str] = Field(default_factory=list)\n\n\nclass PromotionRequest(BaseModel):\n'''
          replacement = '''    critical_case_ids: list[str] = Field(default_factory=list)\n\n    @field_validator("critical_case_ids")\n    @classmethod\n    def normalize_critical_case_ids(cls, values: list[str]) -> list[str]:\n        normalized: list[str] = []\n        seen: set[str] = set()\n        for raw in values:\n            case_id = str(raw).strip()\n            if not case_id:\n                raise ValueError("critical_case_ids must not contain blank IDs")\n            if case_id in seen:\n                continue\n            seen.add(case_id)\n            normalized.append(case_id)\n        return normalized\n\n\nclass PromotionRequest(BaseModel):\n'''
          if anchor not in text:
              raise SystemExit('quality route validator anchor not found')
          path.write_text(text.replace(anchor, replacement, 1), encoding='utf-8')
          PY
          python -m pip install --quiet -e ".[dev]"
          python -m pytest -q tests/test_promotion_release_gates.py
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/api/app/routes/quality.py
          git rm .github/workflows/_tmp_quality_route_validator.yml
          git commit -m "fix: validate promotion critical IDs at API boundary"
          git push origin HEAD:feat/issue-57-promotion-release-gates
