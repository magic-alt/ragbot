name: PDF Scale Benchmark

on:
  workflow_dispatch:
    inputs:
      document_count:
        description: Number of generated engineering PDFs
        required: true
        default: "1000"
      pages_per_document:
        description: Pages per generated PDF
        required: true
        default: "2"
      query_count:
        description: Retrieval queries
        required: true
        default: "100"
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: pdf-scale-${{ github.ref }}
  cancel-in-progress: true

jobs:
  benchmark:
    # Run automatically for this benchmark-development PR. After merge the
    # 1000-PDF test remains an explicit workflow_dispatch capacity gate.
    if: github.event_name == 'workflow_dispatch' || github.head_ref == 'feat/examples-pdf-scale-benchmark'
    name: PostgreSQL + Qdrant PDF corpus
    runs-on: ubuntu-latest
    timeout-minutes: 45
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ragbot
          POSTGRES_PASSWORD: ragbot
          POSTGRES_DB: ragbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragbot -d ragbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install benchmark dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[postgres,qdrant,worker]" reportlab

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:6333/healthz >/dev/null; then
              exit 0
            fi
            sleep 2
          done
          echo "Qdrant did not become healthy" >&2
          exit 1

      - name: Apply full migration chain
        env:
          POSTGRES_DSN: postgresql://ragbot:ragbot@127.0.0.1:5432/ragbot
        run: python -m services.api.app.storage.migrations

      - name: Run PDF corpus benchmark
        env:
          POSTGRES_TEST_DSN: postgresql://ragbot:ragbot@127.0.0.1:5432/ragbot
          QDRANT_URL: http://127.0.0.1:6333
        run: |
          DOCS="${{ github.event.inputs.document_count || '1000' }}"
          PAGES="${{ github.event.inputs.pages_per_document || '2' }}"
          QUERIES="${{ github.event.inputs.query_count || '100' }}"
          python -m benchmarks.pdf_scale \
            --documents "$DOCS" \
            --pages-per-document "$PAGES" \
            --queries "$QUERIES" \
            --collection "ragbot_pdf_scale_${GITHUB_RUN_ID}_${GITHUB_RUN_ATTEMPT}" \
            --output pdf-scale-results.json

      - name: Upload benchmark result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-scale-results
          path: pdf-scale-results.json
          if-no-files-found: warn
