name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and full test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,qdrant,worker,observability]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q contracts services cli eval

      - name: Run tests
        run: python -m pytest -q

  postgres-smoke:
    name: PostgreSQL migration + FTS smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ragbot
          POSTGRES_PASSWORD: ragbot
          POSTGRES_DB: ragbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragbot -d ragbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Postgres test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,qdrant,worker]"

      - name: Apply migrations with production runner
        env:
          POSTGRES_DSN: postgresql://ragbot:ragbot@127.0.0.1:5432/ragbot
        run: python -m services.api.app.storage.migrations

      - name: Run PostgreSQL integration tests
        env:
          POSTGRES_TEST_DSN: postgresql://ragbot:ragbot@127.0.0.1:5432/ragbot
        run: python -m pytest -q tests/test_postgres_integration.py

  node-client:
    name: Node client typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: packages/node-client
        run: npm install --no-package-lock --ignore-scripts

      - name: Typecheck client
        working-directory: packages/node-client
        run: npm run typecheck

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate root Docker Compose
        run: docker compose -f docker-compose.yml config -q

      - name: Validate infra Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml config -q

      - name: Lint Helm chart
        run: helm lint infra/helm/ragbot

      - name: Render Helm defaults
        run: helm template ragbot infra/helm/ragbot >/dev/null
