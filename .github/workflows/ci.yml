name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python-version }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install project and full test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,qdrant,worker,s3,saas,observability]"

      - name: Check dependency consistency
        run: python -m pip check

      - name: Compile Python sources
        run: python -m compileall -q contracts services cli eval benchmarks examples

      - name: Run tests
        run: python -m pytest -q

  example-smoke:
    name: Bundled OpenVLA example
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install example dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[worker]"

      - name: Execute and self-validate example
        run: python examples/example_case.py

  postgres-smoke:
    name: PostgreSQL queue + FTS smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ragbot
          POSTGRES_PASSWORD: ragbot
          POSTGRES_DB: ragbot
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ragbot -d ragbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install Postgres test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev,postgres,qdrant,worker]"

      - name: Apply migrations with production runner
        env:
          POSTGRES_DSN: postgresql://ragbot:ragbot@127.0.0.1:5432/ragbot
        run: python -m services.api.app.storage.migrations

      - name: Run PostgreSQL integration tests
        env:
          POSTGRES_TEST_DSN: postgresql://ragbot:ragbot@127.0.0.1:5432/ragbot
        run: >-
          python -m pytest -q
          tests/test_postgres_integration.py
          tests/test_postgres_control_plane.py
          tests/test_postgres_reliability.py
          tests/test_postgres_staged_generations.py

      - name: Run CJK lexical retrieval benchmark
        env:
          POSTGRES_TEST_DSN: postgresql://ragbot:ragbot@127.0.0.1:5432/ragbot
        run: python -m eval.cjk_retrieval

  recovery-smoke:
    name: Backup + restore smoke
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: ragbot
          POSTGRES_PASSWORD: ragbot
          POSTGRES_DB: ragbot
        ports:
          - 55432:5432
        options: >-
          --health-cmd "pg_isready -U ragbot -d ragbot"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 10
      qdrant:
        image: qdrant/qdrant:v1.19.0
        ports:
          - 6333:6333

    env:
      POSTGRES_DSN: postgresql://ragbot:ragbot@127.0.0.1:55432/ragbot
      QDRANT_URL: http://127.0.0.1:6333
      QDRANT_COLLECTION: ragbot_recovery_smoke

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"
          cache: pip

      - name: Install recovery dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql-client
          python -m pip install --upgrade pip
          python -m pip install -e ".[postgres]"

      - name: Wait for Qdrant
        run: |
          for i in $(seq 1 30); do
            if curl -fsS "$QDRANT_URL/readyz" >/dev/null; then exit 0; fi
            sleep 1
          done
          echo "Qdrant did not become ready" >&2
          exit 1

      - name: Seed recoverable PostgreSQL and Qdrant state
        run: |
          python -m services.api.app.storage.migrations
          python - <<'PY'
          import os
          from services.api.app.storage.managed_pg_repo import ManagedPostgresRepo
          from services.api.app.storage.models import Source

          repo = ManagedPostgresRepo(os.environ['POSTGRES_DSN'], pool_min=1, pool_max=2)
          try:
              repo.add_source(Source(
                  source_id='recovery-source', tenant_id='recovery-tenant',
                  source_type='local_fs', name='Recovery source',
                  config={'path': '/data/recovery'}
              ))
          finally:
              repo.close()
          PY
          curl -fsS -X PUT "$QDRANT_URL/collections/$QDRANT_COLLECTION" \
            -H 'Content-Type: application/json' \
            -d '{"vectors":{"size":4,"distance":"Cosine"}}' >/dev/null
          curl -fsS -X PUT "$QDRANT_URL/collections/$QDRANT_COLLECTION/points?wait=true" \
            -H 'Content-Type: application/json' \
            -d '{"points":[{"id":1,"vector":[1.0,0.0,0.0,0.0],"payload":{"marker":"recovery-ok"}}]}' >/dev/null

      - name: Backup PostgreSQL and Qdrant
        run: bash scripts/backup_ragbot.sh "$RUNNER_TEMP/ragbot-backup"

      - name: Destroy seeded state
        run: |
          psql "$POSTGRES_DSN" -v ON_ERROR_STOP=1 -c "DELETE FROM sources WHERE source_id='recovery-source'"
          curl -fsS -X DELETE "$QDRANT_URL/collections/$QDRANT_COLLECTION" >/dev/null

      - name: Restore PostgreSQL and Qdrant
        run: bash scripts/restore_ragbot.sh "$RUNNER_TEMP/ragbot-backup"

      - name: Verify restored state
        run: |
          count="$(psql "$POSTGRES_DSN" -Atc "SELECT COUNT(*) FROM sources WHERE source_id='recovery-source'")"
          test "$count" = "1"
          python - <<'PY'
          import json, os, urllib.request
          url = f"{os.environ['QDRANT_URL']}/collections/{os.environ['QDRANT_COLLECTION']}/points/1"
          with urllib.request.urlopen(url, timeout=10) as response:
              payload = json.load(response)
          result = payload.get('result') or {}
          assert (result.get('payload') or {}).get('marker') == 'recovery-ok', payload
          print('PostgreSQL + Qdrant backup/restore verified')
          PY

  node-client:
    name: Node client typecheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "22"

      - name: Install client dependencies
        working-directory: packages/node-client
        run: npm install --no-package-lock --ignore-scripts

      - name: Typecheck client
        working-directory: packages/node-client
        run: npm run typecheck

  deployment-config:
    name: Deployment configuration
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Validate root Docker Compose
        run: docker compose -f docker-compose.yml config -q

      - name: Validate infra Docker Compose
        run: docker compose -f infra/docker/docker-compose.yml config -q

      - name: Verify Compose worker reliability and secret isolation
        run: |
          printf 'RAGBOT_CI_SAAS_SECRET=compose-worker-only-sentinel\n' > .ci-worker.env
          for compose_file in docker-compose.yml infra/docker/docker-compose.yml; do
            RAGBOT_WORKER_ENV_FILE="$PWD/.ci-worker.env" \
              docker compose -f "$compose_file" config --format json > .ci-compose.json
            python - "$compose_file" <<'PY'
          import json
          import sys

          compose_file = sys.argv[1]
          with open('.ci-compose.json', encoding='utf-8') as handle:
              config = json.load(handle)
          worker_env = config['services']['worker'].get('environment', {})
          api_env = config['services']['api'].get('environment', {})
          expected = 'compose-worker-only-sentinel'
          assert worker_env.get('RAGBOT_CI_SAAS_SECRET') == expected, (
              f'{compose_file}: worker did not receive the worker env-file secret'
          )
          assert 'RAGBOT_CI_SAAS_SECRET' not in api_env, (
              f'{compose_file}: worker-only secret leaked into API environment'
          )
          expected_worker = {
              'RAGBOT_WORKER_RETRY_BASE_SECONDS': '5',
              'RAGBOT_WORKER_RETRY_MAX_SECONDS': '300',
              'RAGBOT_RECONCILE_SECONDS': '30',
              'RAGBOT_PROVIDER_MAX_ATTEMPTS': '4',
              'RAGBOT_PROVIDER_BACKOFF_BASE_SECONDS': '0.5',
              'RAGBOT_PROVIDER_BACKOFF_MAX_SECONDS': '30',
          }
          for key, value in expected_worker.items():
              assert str(worker_env.get(key)) == value, f'{compose_file}: {key} mismatch'
          assert config['services']['qdrant']['image'] == 'qdrant/qdrant:v1.19.0', (
              f'{compose_file}: Qdrant runtime must be pinned to v1.19.0'
          )
          print(f'{compose_file}: worker reliability + secret isolation OK')
          PY
          done
          rm -f .ci-worker.env .ci-compose.json

      - name: Lint Helm chart
        run: helm lint infra/helm/ragbot

      - name: Render Helm defaults
        run: helm template ragbot infra/helm/ragbot >/dev/null

      - name: Render production Helm with durable worker
        run: >-
          helm template ragbot infra/helm/ragbot
          --set env.RAGBOT_ENV=production
          --set worker.enabled=true
          --set postgres.dsn=postgresql://ragbot:ragbot@postgres/ragbot
          --set qdrant.url=http://qdrant:6333
          >/dev/null

      - name: Verify Helm worker reliability environment
        run: |
          output="$(helm template ragbot infra/helm/ragbot \
            --set worker.enabled=true \
            --set worker.retryBaseSeconds=7 \
            --set worker.retryMaxSeconds=301 \
            --set worker.reconcileSeconds=31 \
            --set worker.providerMaxAttempts=5 \
            --set worker.providerBackoffBaseSeconds=0.75 \
            --set worker.providerBackoffMaxSeconds=35 \
            --set postgres.dsn=postgresql://ragbot:ragbot@postgres/ragbot \
            --set qdrant.url=http://qdrant:6333)"
          echo "$output" | grep -A1 'name: RAGBOT_WORKER_RETRY_BASE_SECONDS' | grep -q 'value: "7"'
          echo "$output" | grep -A1 'name: RAGBOT_WORKER_RETRY_MAX_SECONDS' | grep -q 'value: "301"'
          echo "$output" | grep -A1 'name: RAGBOT_RECONCILE_SECONDS' | grep -q 'value: "31"'
          echo "$output" | grep -A1 'name: RAGBOT_PROVIDER_MAX_ATTEMPTS' | grep -q 'value: "5"'
          echo "$output" | grep -A1 'name: RAGBOT_PROVIDER_BACKOFF_BASE_SECONDS' | grep -q 'value: "0.75"'
          echo "$output" | grep -A1 'name: RAGBOT_PROVIDER_BACKOFF_MAX_SECONDS' | grep -q 'value: "35"'

      - name: Render KEDA queue autoscaling
        run: |
          helm template ragbot infra/helm/ragbot \
            --set worker.enabled=true \
            --set worker.autoscaling.enabled=true \
            --set postgres.dsn=postgresql://ragbot:ragbot@postgres/ragbot \
            --set qdrant.url=http://qdrant:6333 \
            | grep -q 'kind: ScaledObject'

      - name: Render worker-only SaaS secret injection
        run: |
          output="$(helm template ragbot infra/helm/ragbot \
            --set worker.enabled=true \
            --set postgres.dsn=postgresql://ragbot:ragbot@postgres/ragbot \
            --set qdrant.url=http://qdrant:6333 \
            --set 'worker.extraEnvFrom[0].secretRef.name=ragbot-saas-connectors')"
          echo "$output" | grep -q 'name: ragbot-saas-connectors'
          echo "$output" | grep -q 'envFrom:'

      - name: Reject production Helm without worker
        run: |
          if helm template ragbot infra/helm/ragbot \
            --set env.RAGBOT_ENV=production \
            --set postgres.dsn=postgresql://ragbot:ragbot@postgres/ragbot \
            --set qdrant.url=http://qdrant:6333 \
            >/dev/null 2>&1; then
            echo "production chart unexpectedly rendered without durable worker" >&2
            exit 1
          fi
