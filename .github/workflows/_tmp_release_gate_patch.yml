name: Temporary promotion release gate patch

on:
  push:
    branches:
      - feat/issue-57-promotion-release-gates
    paths:
      - .github/workflows/_tmp_release_gate_patch.yml
      - scripts/_apply_release_gate_patch.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: feat/issue-57-promotion-release-gates
      - name: Apply release gate patch
        run: python scripts/_apply_release_gate_patch.py
      - name: Install test dependencies
        run: python -m pip install --quiet -e ".[dev]"
      - name: Run focused release gate regressions
        run: |
          python -m compileall -q services benchmarks
          python -m pytest -q tests/test_promotion_release_gates.py tests/test_quality_observability.py tests/test_promotion_evidence_integrity.py
      - name: Commit product changes and remove temporary patch files
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add services/api/app/quality/contracts.py services/api/app/quality/promotion.py services/api/app/routes/quality.py benchmarks/weighted_rrf_promotion.py benchmarks/retrieval_plan_promotion_legacy.py
          git rm scripts/_apply_release_gate_patch.py .github/workflows/_tmp_release_gate_patch.yml
          git commit -m "feat: add absolute and critical promotion release gates"
          git push origin HEAD:feat/issue-57-promotion-release-gates
