openapi: 3.1.0
info:
  title: RAG Agent API
  version: 0.1.0

servers:
  - url: http://localhost:8000

paths:
  /chat:
    post:
      summary: Chat with Agentic RAG
      operationId: chat
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ChatRequest"
      responses:
        "200":
          description: Chat response (JSON or SSE)
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ChatResponse"
            text/event-stream:
              schema:
                type: string
              examples:
                streamExample:
                  summary: SSE stream example
                  value: |
                    event: token
                    data: {"request_id":"r1","delta":"你好，"}

                    event: tool_call
                    data: {"request_id":"r1","name":"retrieve","args":{"query":"...","top_k":30,"filters":{"tenant_id":"t_123"}}}

                    event: tool_result
                    data: {"request_id":"r1","name":"retrieve","ok":true,"meta":{"count":12}}

                    event: final
                    data: {"request_id":"r1","answer":"...","citations":[{"kind":"chunk","chunk_id":"c1","doc_id":"d1","page":3}],"confidence":"high"}
        "400":
          description: Bad request
        "401":
          description: Unauthorized

  /ingest:
    post:
      summary: Submit ingestion job
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                source_type: { type: string }
                source_config: { type: object }
              required: [source_type, source_config]
      responses:
        "202": { description: Accepted }

  /admin/health:
    get:
      summary: Health check
      responses:
        "200": { description: OK }

components:
  schemas:
    ChatRequest:
      type: object
      required: [query, tenant_id, user_id]
      properties:
        query:
          type: string
          minLength: 1
        tenant_id:
          type: string
        user_id:
          type: string
        session_id:
          type: string
          description: Client-provided session id for continuity
        stream:
          type: boolean
          default: false
        constraints:
          $ref: "#/components/schemas/Constraints"
        client_context:
          type: object
          additionalProperties: true
          description: Optional client metadata (app version, locale, etc.)
      additionalProperties: false

    Constraints:
      type: object
      properties:
        source_types:
          type: array
          items:
            type: string
            enum: [pdf, web, repo, db_doc]
        doc_ids:
          type: array
          items: { type: string }
        tags:
          type: array
          items: { type: string }
        repo:
          type: string
        ref:
          type: string
        path_prefix:
          type: string
        url_prefix:
          type: string
        time_from:
          type: string
          format: date-time
        time_to:
          type: string
          format: date-time
      additionalProperties: false

    ChatResponse:
      type: object
      required: [request_id, answer, citations, confidence]
      properties:
        request_id:
          type: string
        answer:
          type: string
        citations:
          type: array
          items:
            $ref: "#/components/schemas/Citation"
        confidence:
          type: string
          enum: [high, medium, low]
        followups:
          type: array
          items: { type: string }
        debug:
          $ref: "#/components/schemas/DebugInfo"

    Citation:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [chunk, row, code, web]
        chunk_id: { type: string }
        doc_id: { type: string }
        page: { type: integer }
        section: { type: string }
        url: { type: string }
        path: { type: string }
        ref: { type: string }
        line_start: { type: integer }
        line_end: { type: integer }
        row_ref: { type: string }
        title: { type: string }
      additionalProperties: false

    DebugInfo:
      type: object
      properties:
        route:
          type: string
          enum: [doc_rag, sql, code, mixed, web_fallback]
        tool_calls:
          type: array
          items:
            $ref: "#/components/schemas/ToolCallRecord"
      additionalProperties: false

    ToolCallRecord:
      type: object
      required: [name, args, ok, started_at_ms, ended_at_ms]
      properties:
        name:
          type: string
          enum: [retrieve, sql_query, code_search, web_search, web_fetch]
        args:
          type: object
          additionalProperties: true
        ok:
          type: boolean
        started_at_ms:
          type: integer
        ended_at_ms:
          type: integer
        error:
          type: string
        result_preview:
          type: object
          additionalProperties: true
      additionalProperties: false
